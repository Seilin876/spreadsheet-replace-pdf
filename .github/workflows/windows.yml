name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows.yml
      - replace_and_export.py
      - requirements.txt

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build standalone executable
        run: |
          python -m pip install -r requirements.txt pyinstaller==6.22.0
          python -m PyInstaller --clean --onefile --console --name SpreadsheetReplacePDF-win-x64 replace_and_export.py
      - name: Verify Excel integration and packaged executable
        shell: python
        env:
          PYTHONIOENCODING: utf-8
          PYTHONPATH: .
        run: |
          import csv
          import os
          from pathlib import Path
          import subprocess
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          import winreg
          from openpyxl import Workbook, load_workbook
          import replace_and_export as app

          try:
              with winreg.OpenKey(winreg.HKEY_CLASSES_ROOT, r"Excel.Application\CLSID"):
                  excel_installed = True
          except FileNotFoundError:
              excel_installed = False

          class TestWorkbook:
              def ExportAsFixedFormat(self, format_id, output):
                  assert format_id == 0
                  Path(output).write_bytes(b"%PDF-mock")

              def Close(self, save):
                  assert save is False

          class TestExcel:
              def __init__(self):
                  self.Workbooks = self
                  self.closed = False

              def Open(self, filename, update_links, read_only, format_id,
                       password, write_password, ignore_read_only):
                  assert Path(filename).is_file()
                  assert update_links == 0 and read_only
                  return TestWorkbook()

              def Quit(self):
                  self.closed = True

          exe = Path("dist/SpreadsheetReplacePDF-win-x64.exe").resolve()
          with TemporaryDirectory(prefix="replace-pdf test ") as directory:
              folder = Path(directory)
              xlsx = folder / "報表.xlsx"
              table = folder / "報表.csv"
              workbook = Workbook()
              workbook.active["A1"] = "old old"
              workbook.active["B1"] = "=1+1"
              workbook.create_sheet("Second")["A1"] = "old"
              workbook.save(xlsx)
              table.write_text("id,text\n001,old\n", encoding="utf-8")
              originals = {source: source.read_bytes() for source in (xlsx, table)}

              run = subprocess.run(
                  [str(exe)], input=f"{folder}\nold\n新\n".encode(),
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=360,
                  env={**os.environ, "PATH": str(Path(os.environ["SystemRoot"]) / "System32")},
              )
              print(run.stdout.decode(errors="replace"))
              if excel_installed:
                  run.check_returncode()
              else:
                  assert run.returncode == 1
                  assert "Could not start desktop Microsoft Excel." in run.stdout.decode()
                  assert all(file.read_bytes() == original for file, original in originals.items())
                  excel = TestExcel()
                  with patch("win32com.client.DispatchEx", return_value=excel), patch(
                      "builtins.input", side_effect=[str(folder), "old", "新"]
                  ):
                      assert app.main() == 0
                  assert excel.closed and excel.AutomationSecurity == 3
              updated = load_workbook(xlsx)
              assert updated.active["A1"].value == "新 新"
              assert updated.active["B1"].value == "=1+1"
              assert updated["Second"]["A1"].value == "新"
              with table.open(encoding="utf-8", newline="") as stream:
                  assert list(csv.reader(stream)) == [["id", "text"], ["001", "新"]]
              for source in (xlsx, table):
                  assert source.with_name(source.name + ".pdf").read_bytes().startswith(b"%PDF-")
      - uses: actions/upload-artifact@v4
        with:
          name: SpreadsheetReplacePDF-win-x64
          path: dist/SpreadsheetReplacePDF-win-x64.exe
          if-no-files-found: error
